name: impulsive_consumption
description: "Impulsive Consumption - a pure-local mock shopping app."
publish_to: 'none'

version: 1.2.3+6

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  intl: any
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_staggered_grid_view: ^0.7.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: any
  drift_dev: ^2.34.3
  riverpod_generator: ^4.0.8
  path: ^1.9.1
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/images/products/
    - assets/audio/
